# vkbchoom.conf -- read once at launch, no rebuild needed to change anything.
# Place next to smaa_layer.dll (checked here first, then next to mgsvtpp.exe).
#
# SMAA is always on, no hotkey. Set renderMode = bypass below to A/B compare
# against an untouched frame.


# --- Sharpness ----------------------------------------------------------------

# color catches more edges than luma, for a small cost.
smaaEdgeDetection = color

# Main sharpness dial: how much local contrast counts as an edge.
# Higher = sharper, more jaggies survive. Lower = softer, more removed.
#   0.08 very sharp   0.05 SMAA "Ultra"   0.03 default   0.02 aggressive/soft
smaaThreshold = 0.03

# Corner rounding, 0-100. Higher = softer corners, lower = crisper/stairier.
smaaCornerRounding = 25


# --- Quality (cost, not sharpness) --------------------------------------------

# How far along an edge to search before giving up. 32/16 is SMAA's own
# "Ultra" preset and the practical maximum.
smaaMaxSearchSteps = 32
smaaMaxSearchStepsDiag = 16


# --- Sharpen (RCAS) -----------------------------------------------------------

# AMD FSR1's RCAS, sharpen-only (no upscaling).
rcasSharpen = on

# 0.0 = max sharpening, each +1.0 is one stop less. 0.2-0.4 is mild-moderate.
rcasSharpness = 0.20


# --- Depth outline ------------------------------------------------------------

# Tracks the game's own depth buffer. Required for depthOutline below.
depthCapture = on

# Draws a dark outline along depth discontinuities -- real silhouettes --
# rather than colour edges.
depthOutline = off

# Shows raw depth as grayscale instead of the outline. Use to sanity check
# depth capture is actually seeing the right thing.
depthOutlineDebugView = off

# Relative depth difference that counts as an edge (0.05 = 5% closer/farther).
depthOutlineThreshold = 0.05


# --- Plumbing -----------------------------------------------------------------

# Which process this layer is active in. Outside this exe it's a complete
# passthrough (see README: Scope).
targetExecutable = mgsvtpp.exe

# How the layer takes over the swapchain.
#   transfer  (default) renders into intermediates, copies into the real
#             swapchain. One extra copy/frame, visually identical to mutable.
#   mutable   renders directly into the swapchain. Needs
#             VK_KHR_swapchain_mutable_format; try only with overlays off.
#   bypass    layer stays loaded but touches nothing -- baseline for
#             comparison.
renderMode = transfer

# Strips DXVK's exclusive-fullscreen info out of swapchain creation.
# Leave off unless swapchain creation itself is failing.
stripFseInfo = off


# --- Posterize (experimental) -------------------------------------------------

# Flattens colour into discrete bands -- the flat "cel-shaded" look. Off by
# default.
posterize = off

# Steps per colour channel. Lower = flatter/more graphic.
posterizeLevels = 6


# --- Black/white/red (experimental) -------------------------------------------

# Grayscale image with only genuinely saturated red kept in colour
# Off by default.
blackWhiteRed = off

# How strongly red must dominate green/blue to be considered for staying red.
blackWhiteRedSensitivity = 0.35

# How saturated (vs. gray) it also needs to be -- excludes skin tones/warm
# lighting that would otherwise pass the check above.
blackWhiteRedSaturation = 0.45


# --- Screenshots --------------------------------------------------------------

# Key that captures a screenshot (see README). F1-F12, PrintScreen,
# ScrollLock, Pause, Insert, Home, End, PageUp, PageDown. Falls back to F11
# if unset/unrecognised.
screenshotKey = F11
